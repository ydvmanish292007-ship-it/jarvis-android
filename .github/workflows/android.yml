name: Build JARVIS HUD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create JARVIS HUD
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/jarvis/assistant

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JARVIS-HUD"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jarvis.assistant'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.assistant'
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="JARVIS HUD"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jarvis/assistant/MainActivity.java <<'EOF'
          package com.jarvis.assistant;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.*;
          import android.view.*;
          import android.widget.*;
          import android.content.*;
          import android.speech.*;
          import android.speech.tts.TextToSpeech;
          import java.util.*;
          import org.json.JSONObject;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.io.OutputStream;

          public class MainActivity extends Activity {

              TextToSpeech tts;
              TextView status, output;
              HudView hud;
              int green = Color.rgb(0,255,130);
              int red = Color.rgb(255,55,70);

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  getWindow().setStatusBarColor(Color.rgb(2,10,8));
                  getWindow().setNavigationBarColor(Color.BLACK);

                  tts = new TextToSpeech(this, result -> {
                      if(result == TextToSpeech.SUCCESS)
                          tts.setLanguage(Locale.getDefault());
                  });

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(16,12,16,12);
                  root.setBackgroundColor(Color.rgb(2,8,7));
                  setContentView(root);

                  TextView title = new TextView(this);
                  title.setText("J.A.R.V.I.S");
                  title.setTextSize(29);
                  title.setTypeface(Typeface.MONOSPACE,Typeface.BOLD);
                  title.setTextColor(green);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  status = new TextView(this);
                  status.setText("● SYSTEM ONLINE");
                  status.setTextColor(green);
                  status.setGravity(Gravity.CENTER);
                  status.setTypeface(Typeface.MONOSPACE);
                  root.addView(status);

                  hud = new HudView(this);
                  root.addView(hud,new LinearLayout.LayoutParams(
                      -1,0,1));

                  output = new TextView(this);
                  output.setText("JARVIS INITIALIZED\nAwaiting your command, Boss.");
                  output.setTextColor(green);
                  output.setTextSize(14);
                  output.setGravity(Gravity.CENTER);
                  output.setPadding(8,10,8,10);
                  root.addView(output);

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setGravity(Gravity.CENTER);
                  root.addView(buttons);

                  Button scan = new Button(this);
                  scan.setText("SCAN");
                  scan.setTextColor(green);
                  buttons.addView(scan);

                  Button voice = new Button(this);
                  voice.setText("🎙 SPEAK");
                  voice.setTextColor(red);
                  buttons.addView(voice);

                  scan.setOnClickListener(v -> {
                      hud.scanning = !hud.scanning;
                      status.setText(hud.scanning ?
                          "● SCANNING..." : "● SYSTEM ONLINE");
                      hud.invalidate();
                  });

                  voice.setOnClickListener(v -> listen());
              }
                        void askJarvis(String message) {
              output.setText("JARVIS: Thinking...");

              new Thread(() -> {
                  HttpURLConnection conn = null;

                  try {
                      URL url = new URL(
                          "https://jarvis-ai-backend.pages.dev/api/ask"
                      );

                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(30000);
                      conn.setDoOutput(true);
                      conn.setRequestProperty(
                          "Content-Type", "application/json; charset=UTF-8"
                      );

                      JSONObject request = new JSONObject();
                      request.put("message", message);

                      try (OutputStream os = conn.getOutputStream()) {
                          os.write(request.toString().getBytes("UTF-8"));
                      }

                      int code = conn.getResponseCode();

                      java.io.InputStream stream =
                          (code >= 200 && code < 300)
                          ? conn.getInputStream()
                          : conn.getErrorStream();

                      java.util.Scanner scanner =
                          new java.util.Scanner(stream, "UTF-8")
                          .useDelimiter("\\A");

                      String raw = scanner.hasNext() ? scanner.next() : "";
                      scanner.close();

                      JSONObject result = new JSONObject(raw);
                      String answer = result.optString(
                          "answer", "Sorry Boss, no answer received."
                      );

                      runOnUiThread(() -> {
                          output.setText("JARVIS: " + answer);

                          if (tts != null) {
                              tts.setPitch(0.75f);
                              tts.setSpeechRate(0.85f);
                              tts.speak(
                                  answer,
                                  TextToSpeech.QUEUE_FLUSH,
                                  null,
                                  "jarvis_reply"
                              );
                          }
                      });

                  } catch (Exception e) {
                      runOnUiThread(() ->
                          output.setText(
                              "Connection error: " + e.getMessage()
                          )
                      );
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }).start();
          }
          
              void listen() {
                  if(!SpeechRecognizer.isRecognitionAvailable(this)) {
                      output.setText("Speech recognition unavailable.");
                      return;
                  }

                  try {
                      Intent intent = new Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");

                      status.setText("● LISTENING");
                      startActivityForResult(intent,100);
                  } catch(Exception e) {
                      output.setText("Voice service could not start.");
                      status.setText("● SYSTEM ONLINE");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode,
                  int resultCode, Intent data) {
                  super.onActivityResult(requestCode,resultCode,data);

                  if(requestCode == 100) {
                      status.setText("● SYSTEM ONLINE");

                      if(resultCode == RESULT_OK && data != null) {
                          ArrayList<String> results = data.getStringArrayListExtra(
                              RecognizerIntent.EXTRA_RESULTS);

                          if(results != null && !results.isEmpty()) {
                              String command = results.get(0);
                              output.setText("YOU: " + command +
                                  "\n\nHUD active. AI backend connection is not configured.");
                              if(tts != null)
                                  tts.speak(
                                      "Boss, I heard you. AI connection is not configured yet.",
                                      TextToSpeech.QUEUE_FLUSH,null,"reply");
                          }
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  if(tts != null) tts.shutdown();
                  super.onDestroy();
              }

              class HudView extends View {
                  Paint p = new Paint(3);
                  float angle = 0;
                  boolean scanning = true;

                  HudView(Context c) {
                      super(c);
                  }

                  void circle(Canvas c,float x,float y,float r,
                              int color,float width,boolean fill) {
                      p.setColor(color);
                      p.setStrokeWidth(width);
                      p.setStyle(fill ? Paint.Style.FILL : Paint.Style.STROKE);
                      p.setShadowLayer(fill ? 0 : 12,color,0,12);
                      c.drawCircle(x,y,r,p);
                      p.clearShadowLayer();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);

                      float cx=getWidth()/2f;
                      float cy=getHeight()/2f;
                      float radius=Math.min(getWidth(),getHeight())*.34f;

                      p.setColor(Color.rgb(3,18,13));
                      p.setStyle(Paint.Style.FILL);
                      canvas.drawRect(0,0,getWidth(),getHeight(),p);

                      for(int i=1;i<=5;i++)
                          circle(canvas,cx,cy,radius*i/5,
                              i%2==0 ? green : Color.rgb(0,100,65),
                              i==5 ? 3 : 1,false);

                      for(int i=0;i<12;i++) {
                          double a=Math.PI*i/6;
                          float x1=cx+(float)Math.cos(a)*radius*.8f;
                          float y1=cy+(float)Math.sin(a)*radius*.8f;
                          float x2=cx+(float)Math.cos(a)*radius;
                          float y2=cy+(float)Math.sin(a)*radius;

                          p.setColor(green);
                          p.setStrokeWidth(2);
                          canvas.drawLine(x1,y1,x2,y2,p);
                      }

                      p.setColor(green);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(3);

                      RectF oval=new RectF(cx-radius*.68f,
                          cy-radius*.68f,cx+radius*.68f,cy+radius*.68f);

                      canvas.drawArc(oval,angle,105,false,p);
                      canvas.drawArc(oval,angle+180,65,false,p);

                      p.setStyle(Paint.Style.FILL);
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTypeface(Typeface.MONOSPACE);
                      p.setTextSize(radius*.20f);
                      canvas.drawText("J.A.R.V.I.S",cx,cy+radius*.04f,p);

                      p.setTextSize(radius*.09f);
                      canvas.drawText(scanning ?
                          "SCANNING" : "STANDBY",
                          cx,cy+radius*.27f,p);

                      if(scanning) {
                          p.setColor(Color.argb(45,0,255,120));
                          p.setStyle(Paint.Style.FILL);
                          Path path=new Path();
                          path.moveTo(cx,cy);
                          path.lineTo(
                              cx+(float)Math.cos(Math.toRadians(angle))*radius,
                              cy+(float)Math.sin(Math.toRadians(angle))*radius);
                          path.lineTo(
                              cx+(float)Math.cos(Math.toRadians(angle+25))*radius,
                              cy+(float)Math.sin(Math.toRadians(angle+25))*radius);
                          path.close();
                          canvas.drawPath(path,p);
                      }

                      angle=(angle+2)%360;
                      postInvalidateDelayed(35);
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-HUD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
